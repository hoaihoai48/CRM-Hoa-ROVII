name: CRM Quality Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, emulator tests, browser E2E, build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Cloud Functions dependencies from committed lockfile
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Cloud Functions syntax check
        run: npm run lint --prefix functions

      - name: Check local MCP server syntax
        run: node --check mcp-server/server.mjs && node --check mcp-server/smoke-test.mjs

      - name: Local MCP protocol and safety smoke test
        run: node mcp-server/smoke-test.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Firebase Emulator integration tests
        run: npm run test:emulator
        env:
          CI: true

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E against Firebase Emulators
        run: npm run test:e2e
        env:
          CI: true

      - name: Production build
        run: npm run build

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
